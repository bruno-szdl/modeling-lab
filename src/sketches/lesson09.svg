<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 150" style="width:100%;height:auto;display:block;" preserveAspectRatio="xMidYMid meet" font-family="JetBrains Mono, ui-monospace, monospace">
  <rect x="20" y="22" width="360" height="28" fill="none" stroke="currentColor" stroke-width="1" opacity="0.55" rx="3"/>
  <text x="34" y="40" font-size="13" fill="currentColor" opacity="0.8">✓</text>
  <text x="56" y="40" font-size="10" fill="currentColor">revenue · units</text>
  <text x="372" y="40" font-size="9" fill="currentColor" opacity="0.7" text-anchor="end">fully additive — SUM across anything</text>
  <rect x="20" y="56" width="360" height="28" fill="none" stroke="currentColor" stroke-width="1" opacity="0.55" rx="3"/>
  <text x="34" y="74" font-size="13" fill="currentColor" opacity="0.8">~</text>
  <text x="56" y="74" font-size="10" fill="currentColor">account balance</text>
  <text x="372" y="74" font-size="9" fill="currentColor" opacity="0.7" text-anchor="end">semi-additive — across customers, not days</text>
  <rect x="20" y="90" width="360" height="28" fill="none" stroke-width="1.5" rx="3" style="stroke:var(--color-accent-orange);fill:var(--color-accent-orange);fill-opacity:0.1"/>
  <text x="34" y="108" font-size="12" font-weight="700" text-anchor="middle" style="fill:var(--color-accent-orange)">✗</text>
  <text x="56" y="108" font-size="10" fill="currentColor">AOV = revenue ÷ orders</text>
  <text x="372" y="108" font-size="9" font-weight="700" text-anchor="end" style="fill:var(--color-accent-orange)">non-additive — recompute, never sum</text>
  <text x="200" y="138" font-family="Inter, system-ui, sans-serif" font-size="10" fill="currentColor" opacity="0.65" text-anchor="middle">a report stores additive ingredients; ratios get recomputed at query time</text>
</svg>

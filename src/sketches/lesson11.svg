<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 196" style="width:100%;height:auto;display:block;" preserveAspectRatio="xMidYMid meet" font-family="JetBrains Mono, ui-monospace, monospace">
  <!-- fact (left) -->
  <rect x="14" y="20" width="158" height="58" fill="none" stroke="currentColor" stroke-width="1.5" opacity="0.7" rx="3"/>
  <text x="24" y="36" font-size="9" fill="currentColor" opacity="0.65" letter-spacing="0.08em">FACT</text>
  <text x="24" y="51" font-size="11" fill="currentColor">fact_order_items</text>
  <text x="24" y="67" font-size="10" font-weight="700" style="fill:var(--color-accent-orange)">item_amount (metric)</text>

  <!-- dim (right) -->
  <rect x="248" y="20" width="158" height="58" fill="none" stroke="currentColor" stroke-width="1" opacity="0.5" rx="3"/>
  <text x="258" y="36" font-size="9" fill="currentColor" opacity="0.65" letter-spacing="0.08em">DIM</text>
  <text x="258" y="51" font-size="11" fill="currentColor">dim_products</text>
  <text x="258" y="67" font-size="10" font-weight="700" style="fill:var(--color-accent-orange)">category (attribute)</text>

  <!-- FK -> PK join -->
  <path d="M 172 49 L 248 49" fill="none" stroke-width="1.5" stroke-linecap="round" style="stroke:var(--color-accent-orange)" opacity="0.85"/>
  <text x="178" y="43" font-size="8" fill="currentColor" opacity="0.7">product_id (FK → PK)</text>

  <!-- result of GROUP BY category -->
  <text x="20" y="110" font-size="9" fill="currentColor" opacity="0.65" letter-spacing="0.06em">GROUP BY category →</text>
  <rect x="20" y="118" width="196" height="20" fill="none" stroke-width="1.2" rx="2" style="stroke:var(--color-accent-orange);fill:var(--color-accent-orange);fill-opacity:0.08"/>
  <text x="28" y="132" font-size="10" fill="currentColor" opacity="0.85">category      gross_sales</text>
  <rect x="20" y="138" width="196" height="18" fill="none" stroke="currentColor" stroke-width="0.5" opacity="0.3"/>
  <text x="28" y="151" font-size="10" fill="currentColor">Course           780</text>
  <rect x="20" y="156" width="196" height="18" fill="none" stroke="currentColor" stroke-width="0.5" opacity="0.3"/>
  <text x="28" y="169" font-size="10" fill="currentColor">Accessory        280</text>
  <text x="234" y="150" font-family="Inter, system-ui, sans-serif" font-size="9" fill="currentColor" opacity="0.7">same facts,</text>
  <text x="234" y="163" font-family="Inter, system-ui, sans-serif" font-size="9" fill="currentColor" opacity="0.7">sliced by an attribute</text>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 250" style="width:100%;height:auto;display:block;" preserveAspectRatio="xMidYMid meet" font-family="JetBrains Mono, ui-monospace, monospace">
  <!-- arms: fact hub → each dim (FK → PK) -->
  <path d="M 170 110 L 105 70" fill="none" stroke-width="1.5" stroke-linecap="round" style="stroke:var(--color-accent-orange)" opacity="0.85"/>
  <path d="M 250 110 L 315 70" fill="none" stroke-width="1.5" stroke-linecap="round" style="stroke:var(--color-accent-orange)" opacity="0.85"/>
  <path d="M 210 158 L 210 185" fill="none" stroke-width="1.5" stroke-linecap="round" style="stroke:var(--color-accent-orange)" opacity="0.85"/>

  <!-- dim_customers (top-left) -->
  <rect x="15" y="18" width="130" height="52" fill="none" stroke="currentColor" stroke-width="1" opacity="0.5" rx="3"/>
  <text x="25" y="33" font-size="9" fill="currentColor" opacity="0.65" letter-spacing="0.08em">DIM</text>
  <text x="25" y="48" font-size="11" fill="currentColor">dim_customers</text>
  <text x="25" y="63" font-size="10" font-weight="700" style="fill:var(--color-accent-orange)">customer_id (PK)</text>

  <!-- dim_products (top-right) -->
  <rect x="275" y="18" width="130" height="52" fill="none" stroke="currentColor" stroke-width="1" opacity="0.5" rx="3"/>
  <text x="285" y="33" font-size="9" fill="currentColor" opacity="0.65" letter-spacing="0.08em">DIM</text>
  <text x="285" y="48" font-size="11" fill="currentColor">dim_products</text>
  <text x="285" y="63" font-size="10" font-weight="700" style="fill:var(--color-accent-orange)">product_id (PK)</text>

  <!-- fact_orders (center hub) -->
  <rect x="150" y="100" width="120" height="58" fill="none" stroke="currentColor" stroke-width="1.5" opacity="0.7" rx="3"/>
  <text x="162" y="117" font-size="9" fill="currentColor" opacity="0.65" letter-spacing="0.08em">FACT</text>
  <text x="162" y="133" font-size="11" fill="currentColor">fact_orders</text>
  <text x="162" y="149" font-size="9" fill="currentColor" opacity="0.75">FKs → dims, metrics</text>

  <!-- dim_date (bottom-center) -->
  <rect x="145" y="185" width="130" height="52" fill="none" stroke="currentColor" stroke-width="1" opacity="0.5" rx="3"/>
  <text x="155" y="200" font-size="9" fill="currentColor" opacity="0.65" letter-spacing="0.08em">DIM (side quest)</text>
  <text x="155" y="215" font-size="11" fill="currentColor">dim_date</text>
  <text x="155" y="230" font-size="10" font-weight="700" style="fill:var(--color-accent-orange)">date_day (PK)</text>
</svg>

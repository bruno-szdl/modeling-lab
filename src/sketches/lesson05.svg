<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 140" style="width:100%;height:auto;display:block;" preserveAspectRatio="xMidYMid meet" font-family="JetBrains Mono, ui-monospace, monospace">
  <defs>
    <clipPath id="leftA"><circle cx="60" cy="78" r="34"/></clipPath>
    <clipPath id="leftI"><circle cx="240" cy="78" r="34"/></clipPath>
  </defs>
  <text x="80" y="22" font-size="10" font-weight="700" fill="currentColor" text-anchor="middle">LEFT JOIN</text>
  <circle cx="60" cy="78" r="34" fill="none" stroke-width="1.5" style="stroke:var(--color-accent-orange)"/>
  <circle cx="60" cy="78" r="34" style="fill:var(--color-accent-orange);fill-opacity:0.15"/>
  <circle cx="100" cy="78" r="34" fill="none" stroke="currentColor" stroke-width="1.5" opacity="0.6"/>
  <circle cx="100" cy="78" r="34" clip-path="url(#leftA)" style="fill:var(--color-accent-orange);fill-opacity:0.28;stroke:none"/>
  <text x="48" y="82" font-family="Inter, sans-serif" font-size="11" font-weight="600" fill="currentColor">A</text>
  <text x="115" y="82" font-family="Inter, sans-serif" font-size="11" font-weight="600" fill="currentColor">B</text>
  <text x="80" y="130" font-family="Inter, sans-serif" font-size="9" fill="currentColor" opacity="0.65" text-anchor="middle">every A + matching B</text>
  <text x="260" y="22" font-size="10" font-weight="700" fill="currentColor" text-anchor="middle">INNER JOIN</text>
  <circle cx="240" cy="78" r="34" fill="none" stroke="currentColor" stroke-width="1.5" opacity="0.6"/>
  <circle cx="280" cy="78" r="34" fill="none" stroke="currentColor" stroke-width="1.5" opacity="0.6"/>
  <circle cx="280" cy="78" r="34" clip-path="url(#leftI)" style="fill:var(--color-accent-orange);fill-opacity:0.32;stroke:var(--color-accent-orange);stroke-width:1.5"/>
  <text x="228" y="82" font-family="Inter, sans-serif" font-size="11" font-weight="600" fill="currentColor">A</text>
  <text x="295" y="82" font-family="Inter, sans-serif" font-size="11" font-weight="600" fill="currentColor">B</text>
  <text x="260" y="130" font-family="Inter, sans-serif" font-size="9" fill="currentColor" opacity="0.65" text-anchor="middle">only matches</text>
</svg>

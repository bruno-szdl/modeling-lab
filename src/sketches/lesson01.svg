<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 230" style="width:100%;height:auto;display:block;" preserveAspectRatio="xMidYMid meet" font-family="JetBrains Mono, ui-monospace, monospace">
  <!-- raw_orders -->
  <g transform="translate(0, 0)">
    <text x="20" y="14" font-size="9.5" fill="currentColor" opacity="0.6" letter-spacing="0.08em">RAW_ORDERS</text>
    <text x="380" y="14" font-size="9.5" fill="currentColor" opacity="0.6" letter-spacing="0.05em" text-anchor="end">6 rows</text>
    <rect x="20" y="20" width="360" height="34" rx="3" stroke="currentColor" stroke-width="0.8" fill="none" opacity="0.45"/>
    <text x="28" y="33" font-size="9" fill="currentColor" opacity="0.7">order_id   customer_id   order_date    order_status</text>
    <line x1="20" y1="37" x2="380" y2="37" stroke="currentColor" stroke-width="0.5" opacity="0.25"/>
    <text x="28" y="49" font-size="9" fill="currentColor">O001        C001          2024-03-01    delivered  …</text>
    <text x="200" y="68" font-size="11" font-weight="700" text-anchor="middle" style="fill:var(--color-accent-orange)">1 row = 1 order</text>
  </g>

  <!-- raw_order_items -->
  <g transform="translate(0, 78)">
    <text x="20" y="14" font-size="9.5" fill="currentColor" opacity="0.6" letter-spacing="0.08em">RAW_ORDER_ITEMS</text>
    <text x="380" y="14" font-size="9.5" fill="currentColor" opacity="0.6" letter-spacing="0.05em" text-anchor="end">9 rows</text>
    <rect x="20" y="20" width="360" height="34" rx="3" stroke="currentColor" stroke-width="0.8" fill="none" opacity="0.45"/>
    <text x="28" y="33" font-size="9" fill="currentColor" opacity="0.7">order_item_id   order_id   product_id   quantity</text>
    <line x1="20" y1="37" x2="380" y2="37" stroke="currentColor" stroke-width="0.5" opacity="0.25"/>
    <text x="28" y="49" font-size="9" fill="currentColor">OI001            O001        P001          1  …</text>
    <text x="200" y="68" font-size="11" font-weight="700" text-anchor="middle" style="fill:var(--color-accent-orange)">1 row = 1 line item</text>
  </g>

  <!-- raw_payments -->
  <g transform="translate(0, 156)">
    <text x="20" y="14" font-size="9.5" fill="currentColor" opacity="0.6" letter-spacing="0.08em">RAW_PAYMENTS</text>
    <text x="380" y="14" font-size="9.5" fill="currentColor" opacity="0.6" letter-spacing="0.05em" text-anchor="end">7 rows</text>
    <rect x="20" y="20" width="360" height="34" rx="3" stroke="currentColor" stroke-width="0.8" fill="none" opacity="0.45"/>
    <text x="28" y="33" font-size="9" fill="currentColor" opacity="0.7">payment_id   order_id   payment_status   amount</text>
    <line x1="20" y1="37" x2="380" y2="37" stroke="currentColor" stroke-width="0.5" opacity="0.25"/>
    <text x="28" y="49" font-size="9" fill="currentColor">PAY001        O001       paid             180  …</text>
    <text x="200" y="68" font-size="11" font-weight="700" text-anchor="middle" style="fill:var(--color-accent-orange)">1 row = 1 payment</text>
  </g>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 460 320" style="width:100%;height:auto;display:block;" preserveAspectRatio="xMidYMid meet" font-family="JetBrains Mono, ui-monospace, monospace">
  <!-- star arms: fact (FK) → dim (PK); dot marks the dim / PK side -->
  <!-- fact_orders.customer_id → dim_customers -->
  <path d="M 172 100 L 92 70" fill="none" stroke-width="1.3" stroke-linecap="round" style="stroke:var(--color-accent-orange)" opacity="0.75"/>
  <circle cx="92" cy="70" r="2.6" style="fill:var(--color-accent-orange)" opacity="0.9"/>
  <text x="96" y="92" font-size="8" fill="currentColor" opacity="0.7">customer_id</text>

  <!-- fact_order_items.product_id → dim_products -->
  <path d="M 288 156 L 372 70" fill="none" stroke-width="1.3" stroke-linecap="round" style="stroke:var(--color-accent-orange)" opacity="0.75"/>
  <circle cx="372" cy="70" r="2.6" style="fill:var(--color-accent-orange)" opacity="0.9"/>
  <text x="316" y="120" font-size="8" fill="currentColor" opacity="0.7">product_id</text>

  <!-- facts.order_date / payment_date → dim_date -->
  <path d="M 230 224 L 230 250" fill="none" stroke-width="1.3" stroke-linecap="round" style="stroke:var(--color-accent-orange)" opacity="0.75"/>
  <circle cx="230" cy="250" r="2.6" style="fill:var(--color-accent-orange)" opacity="0.9"/>
  <text x="236" y="242" font-size="8" fill="currentColor" opacity="0.7">date_day</text>

  <!-- dim_customers (top-left) -->
  <rect x="16" y="24" width="128" height="46" fill="none" stroke="currentColor" stroke-width="1" opacity="0.5" rx="3"/>
  <text x="28" y="41" font-size="8" fill="currentColor" opacity="0.6" letter-spacing="0.08em">DIM</text>
  <text x="28" y="58" font-size="11" fill="currentColor">dim_customers</text>

  <!-- dim_products (top-right) -->
  <rect x="316" y="24" width="128" height="46" fill="none" stroke="currentColor" stroke-width="1" opacity="0.5" rx="3"/>
  <text x="328" y="41" font-size="8" fill="currentColor" opacity="0.6" letter-spacing="0.08em">DIM</text>
  <text x="328" y="58" font-size="11" fill="currentColor">dim_products</text>

  <!-- fact cluster (center hub) -->
  <rect x="166" y="92" width="128" height="40" fill="none" stroke="currentColor" stroke-width="1.5" opacity="0.75" rx="3"/>
  <text x="178" y="108" font-size="7" fill="currentColor" opacity="0.6" letter-spacing="0.08em">FACT</text>
  <text x="178" y="123" font-size="11" fill="currentColor">fact_orders</text>

  <rect x="166" y="138" width="128" height="40" fill="none" stroke="currentColor" stroke-width="1.5" opacity="0.75" rx="3"/>
  <text x="178" y="154" font-size="7" fill="currentColor" opacity="0.6" letter-spacing="0.08em">FACT</text>
  <text x="178" y="169" font-size="11" fill="currentColor">fact_order_items</text>

  <rect x="166" y="184" width="128" height="40" fill="none" stroke="currentColor" stroke-width="1.5" opacity="0.75" rx="3"/>
  <text x="178" y="200" font-size="7" fill="currentColor" opacity="0.6" letter-spacing="0.08em">FACT</text>
  <text x="178" y="215" font-size="11" fill="currentColor">fact_payments</text>

  <!-- dim_date (bottom-center) -->
  <rect x="166" y="250" width="128" height="46" fill="none" stroke="currentColor" stroke-width="1" opacity="0.5" rx="3"/>
  <text x="178" y="267" font-size="8" fill="currentColor" opacity="0.6" letter-spacing="0.08em">DIM (side quest)</text>
  <text x="178" y="284" font-size="11" fill="currentColor">dim_date</text>

  <text x="230" y="312" font-family="Inter, system-ui, sans-serif" font-size="10" fill="currentColor" opacity="0.65" text-anchor="middle">facts in the middle, dims on the points — every report is one GROUP BY away</text>
</svg>

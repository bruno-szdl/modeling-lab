<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 140" style="width:100%;height:auto;display:block;" preserveAspectRatio="xMidYMid meet" font-family="JetBrains Mono, ui-monospace, monospace">
  <text x="60" y="32" font-size="9" fill="currentColor" opacity="0.6" text-anchor="middle">1 payment</text>
  <rect x="20" y="38" width="80" height="32" fill="none" stroke="currentColor" stroke-width="1" opacity="0.6" rx="3"/>
  <text x="60" y="58" font-size="11" fill="currentColor" text-anchor="middle">PAY001</text>
  <text x="60" y="68" font-size="9" fill="currentColor" opacity="0.7" text-anchor="middle">$180</text>
  <text x="120" y="60" font-family="Inter, sans-serif" font-size="22" fill="currentColor" opacity="0.55">×</text>
  <text x="175" y="32" font-size="9" fill="currentColor" opacity="0.6" text-anchor="middle">2 items in O001</text>
  <rect x="140" y="38" width="80" height="24" fill="none" stroke="currentColor" stroke-width="1" opacity="0.6" rx="3"/>
  <text x="180" y="55" font-size="10" fill="currentColor" text-anchor="middle">OI001</text>
  <rect x="140" y="64" width="80" height="24" fill="none" stroke="currentColor" stroke-width="1" opacity="0.6" rx="3"/>
  <text x="180" y="81" font-size="10" fill="currentColor" text-anchor="middle">OI002</text>
  <text x="240" y="60" font-family="Inter, sans-serif" font-size="22" fill="currentColor" opacity="0.55">=</text>
  <text x="320" y="32" font-size="9" font-weight="700" style="fill:var(--color-accent-orange)" text-anchor="middle">2 rows · $180 each</text>
  <rect x="260" y="38" width="125" height="24" fill="none" stroke-width="1.5" rx="3" style="stroke:var(--color-accent-orange);fill:var(--color-accent-orange);fill-opacity:0.1"/>
  <text x="322" y="55" font-size="10" fill="currentColor" text-anchor="middle">PAY001 ⨯ OI001</text>
  <rect x="260" y="64" width="125" height="24" fill="none" stroke-width="1.5" rx="3" style="stroke:var(--color-accent-orange);fill:var(--color-accent-orange);fill-opacity:0.1"/>
  <text x="322" y="81" font-size="10" fill="currentColor" text-anchor="middle">PAY001 ⨯ OI002</text>
  <text x="200" y="115" font-family="Inter, system-ui, sans-serif" font-size="12" font-weight="700" text-anchor="middle" style="fill:var(--color-accent-orange)">SUM(amount) = $360, not $180</text>
  <text x="200" y="130" font-family="Inter, system-ui, sans-serif" font-size="10" fill="currentColor" opacity="0.65" text-anchor="middle">fan-out: SUM after a finer-grain JOIN double-counts</text>
</svg>
